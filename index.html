<style>
:root{--ink:#1B2A33;--mut:#66737C;--line:#E2E7EA;--bg:#F6F8F9;--teal:#0D6174;--teal-d:#0A4E5D;--soft:#E4F0F2;--red:#B42318;--amber:#92400E}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
header{border-bottom:1px solid #E8EBF0;background:#fff;position:sticky;top:0;z-index:5}
.hwrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 28px}
.hwrap img{height:30px;width:auto;display:block}
.app-name{padding-left:16px;border-left:1px solid var(--line);color:var(--mut);font-size:14px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2F6F7A,#5AA5A8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
nav{display:flex;gap:2px;flex:1;margin-left:8px}
nav a{padding:7px 12px;border-radius:8px;font-weight:500;font-size:14px;text-decoration:none;color:var(--mut)}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--soft);color:var(--teal);font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:28px}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media(max-width:900px){.grid2,.grid4,.grid5{grid-template-columns:1fr 1fr}main{padding:18px}.app-name{display:none}.hwrap{padding:12px 16px}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.mod{border-radius:16px;overflow:hidden;box-shadow:0 4px 18px rgba(27,42,51,.06);cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;outline:none}
.mod:hover,.mod:focus-visible{transform:translateY(-3px);box-shadow:0 14px 34px rgba(13,97,116,.16)}
.mod:focus-visible{box-shadow:0 0 0 3px var(--soft),0 14px 34px rgba(13,97,116,.16)}
.mod .go{display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-weight:600;font-size:15px;margin-top:4px}
.mod .go svg{transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.mod:hover .go svg,.mod:focus-visible .go svg{transform:translateX(6px)}
.mod.opening{transform:scale(1.015);box-shadow:0 20px 44px rgba(13,97,116,.22)}
.mod.opening .go svg{transform:translateX(14px)}
.mod .bar{height:4px;background:linear-gradient(90deg,#0D6174,#7CC4C0)}
.mod .in{padding:22px 22px 16px;display:flex;flex-direction:column;gap:8px}
.ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0D6174,#4E9DA6);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(13,97,116,.28);margin-bottom:6px}
.stats3{border-top:1px solid var(--line);padding-top:14px;margin-top:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3 b{font-size:17px;font-weight:600;display:block}.stats3 span{font-size:13px;color:var(--mut)}
.chips{border-top:1px dashed var(--line);padding:14px 22px 18px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid #C9D1D6;background:#fff;font-size:14px;font-weight:600;color:var(--ink);transition:background .15s,border-color .15s}
.chip:hover{background:var(--bg)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.soon{border:1.5px dashed #C9D1D6;border-radius:16px;padding:22px;background:#FAFBFC;display:flex;flex-direction:column;justify-content:center;gap:10px;color:var(--mut)}
.kpi{background:var(--bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:13px;color:var(--mut);font-weight:500}.kpi b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid #C9D1D6;background:#fff;font-size:14px;font-weight:600;color:#3C4757;text-decoration:none}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red)}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) 96px minmax(0,.9fr) 116px 100px 214px;gap:12px;padding:11px 18px;border-bottom:1px solid #EEF1F5;align-items:center}
.row.it{cursor:pointer;transition:background .15s,transform .2s}
.row.it:hover{background:#F4F9FA}
.row.it:hover .nm{color:var(--teal)}
.row.it:hover .opn{background:var(--teal);color:#fff;border-color:var(--teal)}
.row.it:hover .opn svg{transform:translateX(2px)}
.row.opening{background:var(--soft)!important;transform:scale(.995)}
.opn{width:32px;height:32px;border-radius:8px;border:1px solid #C9D1D6;background:#fff;color:var(--teal);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s}
.opn svg{transition:transform .2s}
.calbtn{position:relative;overflow:hidden}
.calbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.ana-t{display:flex;align-items:center;gap:10px;width:100%;padding:14px 18px;border-radius:14px;border:1px solid #D3E6EA;background:#F2F8F9;font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.ana-t:hover{background:#EAF4F6}
.ana-t .cnt{background:var(--teal);color:#fff;font-size:12px;border-radius:999px;padding:2px 8px}
.ana-t .chev{margin-left:auto;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.ana-t[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ana{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1),opacity .3s}
.ana.open{grid-template-rows:1fr;opacity:1}
.ana>div{overflow:hidden;min-height:0}
.tipgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:860px){.row{grid-template-columns:minmax(0,1fr) auto}.row .hs,.row.h{display:none}.tipgrid,.grid3{grid-template-columns:1fr}}
.row.h{background:#F8FAFC;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.row .nm{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ls{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscroll{overflow:hidden}
.flex{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.colm{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px}
.cols{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px}
.tips{background:#F2F8F9;border:1px solid #D3E6EA;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.tip{background:#fff;border-radius:12px;padding:11px 14px}
.tip small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:3px}
.tip span{font-size:13px;line-height:1.5;color:#3C4757}
.bars{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;border-radius:5px;background:#EEF1F5}.track i{display:block;height:10px;border-radius:5px;background:var(--teal)}
.pad{padding:20px}
.line{border-top:4px solid}
.tl{display:grid;grid-template-columns:70px 16px 1fr;gap:12px}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:4px}
.tl .st{width:2px;flex:1;background:var(--line);min-height:24px}
.ev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.evi{border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink)}
.evi .th{height:100px;background:#EEF1F5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut)}
.evi .nm{padding:7px 10px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{min-height:64px;border-radius:12px;border:1.5px dashed #B9C3D0;background:#F8FAFC;font-weight:600;color:#3C4757;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.drop.over{background:#EAF3F3;border-color:var(--teal)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3C4757}
label.f input,label.f textarea,label.f select{font-weight:400;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #D5DBE4;background:#fff}
#modal{position:fixed;inset:0;background:rgba(15,27,45,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
#modal .box{background:#fff;border-radius:18px;max-width:720px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:30;max-width:90vw}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--mut)}
.search{display:flex;align-items:center;gap:8px;border:1px solid #C9D1D6;border-radius:8px;padding:0 12px;min-height:38px;min-width:280px;background:#fff}
.search input{border:none;outline:none;flex:1;font-size:14px;background:transparent}

.mod .in{position:relative}
.mod .arr{position:absolute;top:22px;right:22px;width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--teal);display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s,transform .28s cubic-bezier(.2,.7,.2,1)}
.mod:hover .arr,.mod:focus-visible .arr{background:var(--teal);color:#fff;transform:translateX(3px)}
.mod.opening .arr{transform:translateX(10px) scale(1.08);background:var(--teal);color:#fff}
.fold{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.fold-t{display:flex;align-items:center;gap:10px;width:100%;padding:14px 18px;border:0;background:#fff;font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.fold-t:hover{background:var(--bg)}
.fold-t .cnt{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700}
.fold-t .chev{margin-left:auto;color:var(--mut);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.fold-t[aria-expanded="true"] .chev{transform:rotate(180deg)}
.segc{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.segc button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mut)}
.segc button.on{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(27,42,51,.12)}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kc span{font-size:13px;color:var(--mut)}.kc b{font-size:24px;font-weight:600;letter-spacing:-.01em}.kc small{font-size:12px;color:var(--mut)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vbars i{display:block;width:100%;max-width:34px;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:2px}
.vbars em{font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap}
.vbars b{font-size:12px}
.ktab{width:100%;border-collapse:collapse;font-size:13px}
.ktab th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;background:#F8FAFB;border-bottom:1px solid var(--line)}
.ktab td{padding:9px 12px;border-bottom:1px solid #EEF1F5}
.ktab td.n,.ktab th.n{text-align:right}
.ktab tr.lk{cursor:pointer}.ktab tr.lk:hover td{background:#F4F9FA}
@media(max-width:860px){.kgrid{grid-template-columns:1fr 1fr}.ktab .hs{display:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px)}}
#app.enter{animation:viewIn .42s cubic-bezier(.2,.7,.2,1)}
#app.leaving{animation:viewOut .24s ease forwards}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes outL{to{opacity:0;transform:translateX(-26px)}}
#app.enter-r{animation:inR .45s cubic-bezier(.2,.7,.2,1)}
#app.enter-l{animation:inL .45s cubic-bezier(.2,.7,.2,1)}
#app.leaving-l{animation:outL .22s ease forwards}
#app.enter-r .card,#app.enter-r .line{animation:viewIn .55s cubic-bezier(.2,.7,.2,1) both}
#app.enter .mod,#app.enter .kpi{animation:viewIn .5s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){#app.enter-r,#app.enter-l,#app.leaving-l,#app.enter-r .card,.ana,#app.enter,#app.leaving,#app.enter .mod,#app.enter .kpi{animation:none}.mod,.mod .go svg{transition:none}}
</style>

<script>
// ====== CONFIGURACIÓN ======
const CONFIG = {
  clientId: 'f0e84e7f-82f3-4f42-9ebb-4e95e1fca868',

};
const LISTS = { rec: 'Reclamos', seg: 'Seguimientos', evi: 'Evidencias' };
const GRAPH = ['User.Read', 'Sites.Manage.All'];
const SP_SCOPE = [`https://${CONFIG.host}/AllSites.Manage`];
const MAIL = ['Mail.Read'];

const P = {
  cliente:     { t: 'Cliente',     c: '#1D4ED8', bg: '#E8F0FE', bar: '#2563EB' },
  aseguradora: { t: 'Aseguradora', c: '#9A3412', bg: '#FDEDE3', bar: '#C2410C' },
  corredora:   { t: 'Corredora',   c: '#6D28D9', bg: '#F1EBFD', bar: '#7C3AED' },
  garrett:     { t: 'Garrett',     c: '#334155', bg: '#EEF1F5', bar: '#64748B' }
};
const TIPOS = { AU: 'Autos', IN: 'Incendio / propiedad', RC: 'Resp. civil', GM: 'Gastos médicos' };

// ====== ESTADO ======
let pca, ME = '', S = '', LID = {}, DRIVE = '', REC = [], SEG = [];
let VIEW = { f: 'hoy', q: '', all: false, ana: false, tab: 'bandeja', per: 30, homeDue: false, homeTips: false, keep: false };
const TODAY = ymd(new Date());

// ====== FECHAS ======
function D(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addD(s, n) { const d = D(s); d.setDate(d.getDate() + n); return ymd(d); }
function biz(s) { const d = D(s); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); return ymd(d); }
function diff(a, b) { return Math.round((D(a) - D(b)) / 864e5); }
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fd(s) { if (!s) return '—'; const d = D(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`; }
function rel(s) { if (!s) return ''; const n = diff(s, TODAY); return n === 0 ? 'hoy' : n < 0 ? `hace ${-n} día${n === -1 ? '' : 's'}` : n === 1 ? 'mañana' : `en ${n} días`; }
function dColor(s) { if (!s) return '#3C4757'; return s < TODAY ? 'var(--red)' : s === TODAY ? 'var(--amber)' : '#3C4757'; }
const LONG = new Intl.DateTimeFormat('es-CR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

// ====== UTIL ======
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(m, ms = 3500) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }
function modal(html) { $('mbox').innerHTML = html; $('modal').style.display = 'flex'; }
function closeModal() { $('modal').style.display = 'none'; }
function pill(k) { const p = P[k] || P.garrett; return `<span class="pill" style="background:${p.bg};color:${p.c}">${p.t}</span>`; }
const isOpen = r => r.Estado !== 'Cerrado';
const segsOf = id => SEG.filter(s => Number(s.ReclamoId) === id).sort((a, b) => (b.Fecha || '').localeCompare(a.Fecha || '') || b.id - a.id);
const core = s => String(s || '').replace(/^\s*((re|rv|fw|fwd)\s*:\s*)+/i, '').trim();
const tipo = r => TIPOS[String(r.Ref || '').slice(0, 2).toUpperCase()] || 'Otros';
const initials = n => String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ====== AUTH + GRAPH ======
async function token(scopes = GRAPH) {
  const account = pca.getActiveAccount();
  try { return (await pca.acquireTokenSilent({ scopes, account })).accessToken; }
  catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError && scopes === GRAPH) { await pca.acquireTokenRedirect({ scopes }); }
    throw e;
  }
}
async function g(path, opt = {}) {
  const t = await token();
  const url = path.startsWith('http') ? path : 'https://graph.microsoft.com/v1.0' + path;
  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (r.status === 204) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(j?.error?.message || ('Error ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function gAll(path) { let out = [], url = path; while (url) { const j = await g(url); out = out.concat(j.value || []); url = j['@odata.nextLink']; } return out; }
async function batch(reqs) {
  // reqs: [{method,url,body}] -> responses en el mismo orden; reintenta 429/503
  const res = new Array(reqs.length);
  for (let i = 0; i < reqs.length; i += 20) {
    let pend = reqs.slice(i, i + 20).map((r, k) => ({ ...r, id: String(i + k) }));
    for (let tries = 0; pend.length && tries < 6; tries++) {
      const j = await g('/$batch', { method: 'POST', body: JSON.stringify({ requests: pend.map(r => ({ id: r.id, method: r.method, url: r.url, headers: { 'Content-Type': 'application/json' }, body: r.body })) }) });
      const retry = [];
      for (const x of j.responses) {
        if (x.status === 429 || x.status === 503) retry.push(pend.find(p => p.id === x.id));
        else res[+x.id] = x;
      }
      pend = retry;
      if (pend.length) await sleep(4000 * (tries + 1));
    }
  }
  return res;
}
const itemsUrl = k => `/sites/${S}/lists/${LID[k]}/items`;

// ====== ARRANQUE ======
async function init() {
  if (CONFIG.clientId.startsWith('PEGAR')) { $('app').innerHTML = '<div class="center">Falta poner el Client ID y el Tenant ID en CONFIG.</div>'; return; }
  pca = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: 'https://login.microsoftonline.com/' + CONFIG.tenantId, redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: 'localStorage' }
  });
  await pca.initialize();
  const res = await pca.handleRedirectPromise();
  if (res?.account) pca.setActiveAccount(res.account);
  const acc = pca.getActiveAccount() || pca.getAllAccounts()[0];
  if (!acc) return pca.loginRedirect({ scopes: GRAPH });
  pca.setActiveAccount(acc);
  ME = acc.name || acc.username;
  $('uName').textContent = ME; $('uAv').textContent = initials(ME); $('hdr').hidden = false;
  try {
    $('app').innerHTML = '<div class="center">Conectando con SharePoint…</div>';
    S = (await g(`/sites/${CONFIG.host}:${CONFIG.sitePath}`)).id;
    await ensureLists();
    await loadAll();
    route(); animateIn();
  } catch (e) {
    console.error(e);

async function ensureLists() {
  const have = await gAll(`/sites/${S}/lists?$select=id,displayName`);
  const find = n => have.find(l => l.displayName === n)?.id;
  for (const k in LISTS) LID[k] = find(LISTS[k]);
  const missing = Object.keys(LISTS).filter(k => !LID[k]);
  if (missing.length) {
    $('app').innerHTML = '<div class="center">Creando las listas en SharePoint (solo la primera vez)…</div>';
    const T = n => ({ name: n, text: { maxLength: 255 } }), M = n => ({ name: n, text: { allowMultipleLines: true } }), N = n => ({ name: n, number: {} });
    const DEF = {
      rec: { cols: [T('Ref'), T('Aseguradora'), T('Poliza'), T('AsuntoCliente'), T('CorreoCliente'), T('AsuntoAseguradora'), T('CorreoAseguradora'), M('Notas'), T('Estado'), T('Esperando'), T('ProximoSeguimiento'), T('IdAnterior')], tpl: 'genericList' },
      seg: { cols: [N('ReclamoId'), M('Texto'), T('Fecha'), T('Esperando'), T('Autor'), T('IdAnterior')], tpl: 'genericList' },
      evi: { cols: [], tpl: 'documentLibrary' }
    };
    for (const k of missing) {
      try {
        const body = { displayName: LISTS[k], list: { template: DEF[k].tpl } };
        if (DEF[k].cols.length) body.columns = DEF[k].cols;
        LID[k] = (await g(`/sites/${S}/lists`, { method: 'POST', body: JSON.stringify(body) })).id;
      } catch (e) {
        if (e.status === 403) throw new Error('Tu cuenta no tiene acceso a las listas de Reclamos.');
        throw e;
      }
    }
    await pinQuickLaunch(missing.map(k => LISTS[k]));
  }
  DRIVE = (await g(`/sites/${S}/lists/${LID.evi}/drive?$select=id`)).id;
}

async function pinQuickLaunch(titles) {
  let t;
  try { t = (await pca.acquireTokenSilent({ scopes: SP_SCOPE, account: pca.getActiveAccount() })).accessToken; }
  catch (e) { toast('Listas creadas, pero no se pudieron fijar en la barra lateral (falta el permiso AllSites.Manage).', 7000); return; }
  for (const title of titles) {
    try {
      await fetch(`https://${CONFIG.host}${CONFIG.sitePath}/_api/web/lists/getbytitle('${title}')`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + t, Accept: 'application/json;odata=nometadata', 'Content-Type': 'application/json;odata=nometadata', 'IF-MATCH': '*', 'X-HTTP-Method': 'MERGE' },
        body: JSON.stringify({ OnQuickLaunch: true })
      });
    } catch (e) { console.warn('Quick launch', title, e); }
  }
}

// ====== NÚMEROS Y TIPS ======
function nums() {
  const open = REC.filter(isOpen), wk = addD(TODAY, 6);
  return {
    open, abiertos: open.length, cerrados: REC.length - open.length,
    atrasados: open.filter(r => r.ProximoSeguimiento && r.ProximoSeguimiento < TODAY).length,
    hoy: open.filter(r => r.ProximoSeguimiento === TODAY).length,
    semana: open.filter(r => r.ProximoSeguimiento > TODAY && r.ProximoSeguimiento <= wk).length
  };
}
function firstDate(r) { const s = segsOf(r.id); return s.length ? s[s.length - 1].Fecha : String(r.Created || '').slice(0, 10); }
function streak(r) { const s = segsOf(r.id); if (s.length < 3) return null; const k = s[0].Esperando; return s.slice(0, 3).every(x => x.Esperando === k) && k === r.Esperando ? k : null; }

function tips() {
  const open = REC.filter(isOpen), out = [];
  const late = open.filter(r => r.ProximoSeguimiento && r.ProximoSeguimiento < TODAY).sort((a, b) => a.ProximoSeguimiento.localeCompare(b.ProximoSeguimiento));
  if (late.length) out.push({ rule: 'Atrasados', text: `Hay ${late.length} seguimiento${late.length > 1 ? 's' : ''} vencido${late.length > 1 ? 's' : ''}. El más atrasado es ${late[0].Title} (${rel(late[0].ProximoSeguimiento)}).`, id: late[0].id });
  // mismo cliente
  const byC = {};
  open.forEach(r => { const k = String(r.Title || '').split('/')[0].trim().toUpperCase(); if (k) (byC[k] = byC[k] || []).push(r); });
  Object.entries(byC).filter(([, v]) => v.length >= 3).sort((a, b) => b[1].length - a[1].length).slice(0, 2).forEach(([k, v]) => {
    const wc = v.filter(r => r.Esperando === 'cliente').length;
    out.push({ rule: 'Mismo cliente', text: `${k} tiene ${v.length} reclamos abiertos${wc > 1 ? ` y ${wc} esperan al cliente` : ''}. Un solo correo o llamada puede mover varios.` });
  });
  // misma póliza
  const byP = {};
  open.forEach(r => { const k = String(r.Poliza || '').replace(/\s/g, '').toUpperCase(); if (k.length >= 4) (byP[k] = byP[k] || []).push(r); });
  Object.entries(byP).filter(([, v]) => v.length >= 2).slice(0, 2).forEach(([k, v]) => {
    out.push({ rule: 'Misma póliza', text: `Hay ${v.length} reclamos abiertos en la póliza ${k} (${[...new Set(v.map(r => r.Title))].join(', ')}). Dales seguimiento juntos.` });
  });
  // aseguradora acumulada
  const byA = {};
  open.filter(r => r.Esperando === 'aseguradora').forEach(r => { const k = r.Aseguradora || '—'; byA[k] = (byA[k] || 0) + 1; });
  const topA = Object.entries(byA).sort((a, b) => b[1] - a[1])[0];
  if (topA && topA[1] >= 4) out.push({ rule: 'Aseguradora', text: `${topA[0]} tiene ${topA[1]} reclamos esperando su respuesta. Un correo agrupado al ejecutivo ahorra tiempo.` });
  // sin respuesta
  const quiet = open.filter(r => streak(r) === 'cliente');
  if (quiet.length) out.push({ rule: 'Sin respuesta', text: `${quiet.length} cliente${quiet.length > 1 ? 's llevan' : ' lleva'} 3 seguimientos seguidos sin responder${quiet.length <= 3 ? ` (${quiet.map(r => r.Title).join(', ')})` : ''}. Prueba con llamada o WhatsApp.` });
  // caso antiguo
  const old = open.map(r => ({ r, d: firstDate(r) })).filter(x => x.d).sort((a, b) => a.d.localeCompare(b.d))[0];
  if (old && diff(TODAY, old.d) >= 60) out.push({ rule: 'Caso antiguo', text: `El reclamo abierto más antiguo es ${old.r.Title}, con ${diff(TODAY, old.d)} días. Vale la pena escalarlo.`, id: old.r.id });
  // día cargado
  const hoy = open.filter(r => r.ProximoSeguimiento === TODAY).length;
  let d = TODAY, cnt = 0, days = 0;
  while (days < 5) { d = addD(d, 1); if ([0, 6].includes(D(d).getDay())) continue; days++; cnt += open.filter(r => r.ProximoSeguimiento === d).length; }
  const avg = cnt / 5;
  if (hoy >= 5 && hoy >= avg * 1.5) out.push({ rule: 'Día cargado', text: `Hoy hay ${hoy} seguimientos contra unos ${Math.round(avg)} por día el resto de la semana. Puedes mover algunos sin atrasarlos.` });
  return out;
}
function tipsHtml(list) {
  if (!list.length) return '<div class="tip"><span>Todo en orden, no hay nada que destacar.</span></div>';
  return list.map(t => `<div class="tip"><small>${t.rule}</small><span>${esc(t.text)}</span>${t.id ? ` <a href="#caso-${t.id}" style="font-size:12px;font-weight:600">Ver</a>` : ''}</div>`).join('');
}
function waitBar(open) {
  const c = {}; open.forEach(r => c[r.Esperando] = (c[r.Esperando] || 0) + 1);
  const tot = open.length || 1, keys = Object.keys(P).filter(k => c[k]);

    <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px">${keys.map(k => `<div style="width:${c[k] / tot * 100}%;background:${P[k].bar}"></div>`).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#3C4757">${keys.map(k => `<span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:${P[k].bar}"></i>${P[k].t} ${c[k]}</span>`).join('')}</div></div>`;
}

// ====== EVIDENCIAS ======
async function loadEvidence(id) {
  const box = $('evList'); if (!box) return;
  let items = [];
  try { items = (await g(`/drives/${DRIVE}/root:/R-${id}:/children?$expand=thumbnails&$top=200`)).value || []; }
  catch (e) { if (e.status !== 404) { box.innerHTML = `<span class="sub">${esc(e.message)}</span>`; return; } }
  if (!$('evList')) return;
  box.innerHTML = items.length ? items.map(f => {
    const th = f.thumbnails?.[0]?.medium?.url, mt = f.file?.mimeType || '';
    const kind = mt.startsWith('video') ? 'VIDEO' : mt.startsWith('image') ? 'FOTO' : (f.name.split('.').pop() || 'ARCHIVO').toUpperCase();
    return `<a class="evi" href="${esc(f.webUrl)}" target="_blank" rel="noopener"><div class="th" style="${th ? `background-image:url('${esc(th)}')` : ''}">${th && kind !== 'VIDEO' ? '' : kind === 'VIDEO' ? '<span style="background:rgba(15,27,45,.7);color:#fff;padding:4px 10px;border-radius:999px">▶ VIDEO</span>' : kind}</div><div class="nm">${esc(f.name)}</div></a>`;
  }).join('') : '<span class="sub" style="font-size:13px">Todavía no hay evidencias.</span>';
}
async function upload(id, files) {
  if (!files.length) return;
  const prog = $('upProg');
  for (const [i, file] of files.entries()) {
    const label = `Subiendo ${i + 1} de ${files.length}: ${file.name}`;
    prog.textContent = label;
    const path = `/drives/${DRIVE}/root:/R-${id}/${encodeURIComponent(file.name)}`;
    try {
      if (file.size < 4 * 1024 * 1024) {
        const t = await token();
        const r = await fetch(`https://graph.microsoft.com/v1.0${path}:/content?@microsoft.graph.conflictBehavior=rename`, { method: 'PUT', headers: { Authorization: 'Bearer ' + t, 'Content-Type': file.type || 'application/octet-stream' }, body: file });
        if (!r.ok) throw new Error('Error ' + r.status);
      } else {
        const ses = await g(`${path}:/createUploadSession`, { method: 'POST', body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'rename' } }) });
        const CH = 320 * 1024 * 16;
        for (let s = 0; s < file.size; s += CH) {
          const e = Math.min(s + CH, file.size);
          const r = await fetch(ses.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${s}-${e - 1}/${file.size}` }, body: file.slice(s, e) });
          if (!r.ok && r.status !== 202) throw new Error('Error ' + r.status);
          prog.textContent = `${label} · ${Math.round(e / file.size * 100)}%`;
        }
      }
    } catch (e) { toast(`No se pudo subir ${file.name}: ${e.message}`, 6000); }
  }
  const r = REC.find(x => x.id === id);
  await addSeg(r, `Se ${files.length > 1 ? `suben ${files.length} evidencias` : `sube la evidencia ${files[0].name}`}`, r.Esperando);
  prog.textContent = ''; toast('Evidencias subidas'); viewCaso(id);
}

async function importOld(file) {
  if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('Ese archivo no es un JSON válido'); }
  const cases = data.cases || [];
  const pmap = {};
  (data.parties || []).forEach(p => { const l = String(p.label || '').toLowerCase(); pmap[p.id] = p.id === 'client' ? 'cliente' : p.id === 'insurer' ? 'aseguradora' : l.includes('corred') ? 'corredora' : 'garrett'; });
  const W = k => pmap[k] || (k === 'client' ? 'cliente' : k === 'insurer' ? 'aseguradora' : 'garrett');
  const done = {}; REC.forEach(r => { if (r.IdAnterior) done[r.IdAnterior] = r.id; });
  const segDone = new Set(SEG.map(s => s.IdAnterior).filter(Boolean));
  const todo = cases.filter(c => !done[c.id]);
  const nlogs = cases.reduce((s, c) => s + (c.log || []).filter(l => !segDone.has(l.id)).length, 0);
  if (!todo.length && !nlogs) return toast('Todo ese respaldo ya estaba importado.');
  if (!confirm(`Se van a importar ${todo.length} reclamos y ${nlogs} seguimientos. ¿Seguimos?`)) return;
  modal('<h2 style="margin:0">Importando…</h2><div id="impMsg" class="sub">Preparando</div><div class="track"><i id="impBar" style="width:0%"></i></div><span class="sub" style="font-size:13px">No cierres esta pestaña.</span>');
  const setP = (m, p) => { $('impMsg').textContent = m; $('impBar').style.width = p + '%'; };
  const splitIns = s => { const m = String(s || '').trim().match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ]+)\s*[\/\-]?\s*(.*)$/); if (!m) return ['', String(s || '')]; let a = m[1]; a = a.length <= 4 ? a.toUpperCase() : a.charAt(0).toUpperCase() + a.slice(1).toLowerCase(); return [a, m[2].trim()]; };
  const recFields = todo.map(c => { const [a, p] = splitIns(c.insurer); return {
    Title: String(c.client || 'Sin nombre').slice(0, 255), Ref: c.ref || '', Aseguradora: a, Poliza: p,
    AsuntoCliente: String(c.csubj || '').slice(0, 255), AsuntoAseguradora: String(c.isubj || '').slice(0, 255), Notas: c.notes || '',
    Estado: c.status === 'closed' ? 'Cerrado' : 'Abierto', Esperando: W(c.waiting), ProximoSeguimiento: String(c.follow || '').slice(0, 10), IdAnterior: c.id }; });
  setP('Creando reclamos…', 2);
  const res = await batch(recFields.map(f => ({ method: 'POST', url: itemsUrl('rec'), body: { fields: f } })));
  const idMap = { ...done };
  res.forEach((x, i) => { if (x && x.status === 201) { idMap[todo[i].id] = +x.body.id; REC.push({ ...recFields[i], id: +x.body.id }); } });
  const newRec = Object.keys(idMap).length - Object.keys(done).length;
  setP(`Reclamos listos (${newRec}). Creando seguimientos…`, 10);
  const segFields = [];
  cases.forEach(c => { const rid = idMap[c.id]; if (!rid) return; (c.log || []).filter(l => !segDone.has(l.id)).forEach(l => segFields.push({ Title: String(c.ref || c.client || '').slice(0, 255), ReclamoId: rid, Texto: l.text || '', Fecha: String(l.date || '').slice(0, 10), Esperando: W(l.waiting), Autor: 'Sistema anterior', IdAnterior: l.id })); });
  let ok = 0;
  for (let i = 0; i < segFields.length; i += 100) {
    const part = segFields.slice(i, i + 100);
    const r2 = await batch(part.map(f => ({ method: 'POST', url: itemsUrl('seg'), body: { fields: f } })));
    r2.forEach((x, k) => { if (x && x.status === 201) { ok++; SEG.push({ ...part[k], id: +x.body.id }); } });
    setP(`Seguimientos: ${ok} de ${segFields.length}`, 10 + Math.round((i + part.length) / segFields.length * 90));
  }
  const fail = (todo.length - newRec) + (segFields.length - ok);
  $('mbox').innerHTML = `<h2 style="margin:0">Importación lista</h2><p>${newRec} reclamos y ${ok} seguimientos importados.${fail ? ` ${fail} fallaron; si vuelves a importar el mismo archivo, solo intenta los que faltan.` : ''}</p><div style="text-align:right"><button class="btn pri" data-a="close">Listo</button></div>`;
  route();
}

init().catch(e => {
  console.error(e);
  const msg = typeof msal === 'undefined' ? 'No cargó la librería de inicio de sesión de Microsoft. Revisa tu conexión o si algo la está bloqueando.' : (e.errorMessage || e.message || String(e));
  $('app').innerHTML = `<div class="center"><b style="color:var(--ink);font-size:18px">No se pudo iniciar sesión</b><div style="max-width:640px">${esc(msg)}</div></div>`;
});
</script>
</body>
</html>
